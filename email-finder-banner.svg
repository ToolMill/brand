<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 400" width="1280" height="400">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1c2733"/><stop offset="1" stop-color="#101820"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="400" rx="28" fill="url(#g)"/>
  <!-- subtle grid -->
  <g stroke="#2b3a49" stroke-width="1" opacity="0.6">
    <path d="M0 100H1280M0 200H1280M0 300H1280M160 0V400M320 0V400M480 0V400M640 0V400M800 0V400M960 0V400M1120 0V400"/>
  </g>
  <!-- wordmark -->
  <text x="88" y="150" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="700" font-size="54" fill="#e2b23a" letter-spacing="1">TOOLMILL</text>
  <text x="88" y="222" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="700" font-size="60" fill="#ffffff">Email Finder</text>
  <text x="88" y="262" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="28" fill="#c7d0d9">Name + company domain in. Verified address out.</text>
  <text x="88" y="298" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="28" fill="#c7d0d9">Learns each company's pattern once.</text>
  <!-- verdict chips -->
  <g font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="22" font-weight="700">
    <rect x="88" y="326" width="170" height="44" rx="22" fill="#1f8a5b"/><text x="173" y="356" text-anchor="middle" fill="#fff">found</text>
    <rect x="272" y="326" width="190" height="44" rx="22" fill="#b3472f"/><text x="367" y="356" text-anchor="middle" fill="#fff">not found</text>
    <rect x="476" y="326" width="120" height="44" rx="22" fill="#e2b23a"/><text x="536" y="356" text-anchor="middle" fill="#1c2733">guess</text>
    <rect x="610" y="326" width="150" height="44" rx="22" fill="#5c6873"/><text x="685" y="356" text-anchor="middle" fill="#fff">unknown</text>
  </g>
  <!-- envelope mark, right -->
  <g transform="translate(930 60) scale(0.92)">
    <rect x="0" y="40" width="300" height="200" rx="26" fill="none" stroke="#ffffff" stroke-width="22"/>
    <path d="M14 62 L150 166 L286 62" fill="none" stroke="#ffffff" stroke-width="22" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="272" cy="232" r="66" fill="#1f8a5b" stroke="#141c24" stroke-width="16"/>
    <path d="M240 234 L264 258 L308 206" fill="none" stroke="#fff" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
