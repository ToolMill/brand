<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <rect width="512" height="512" fill="#1c2733"/>
  <!-- the mill: four sails turning, one catching the light -->
  <g transform="translate(256 256) rotate(-20)">
    <rect x="28" y="-34" width="176" height="68" rx="34" fill="#e2b23a"/>
    <rect x="28" y="-34" width="176" height="68" rx="34" fill="#e2b23a" transform="rotate(90)"/>
    <rect x="28" y="-34" width="176" height="68" rx="34" fill="#e2b23a" transform="rotate(180)"/>
    <rect x="28" y="-34" width="176" height="68" rx="34" fill="#ffffff" transform="rotate(270)"/>
    <circle r="40" fill="#1c2733" stroke="#e2b23a" stroke-width="14"/>
  </g>
</svg>
